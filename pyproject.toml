[project]
name = "unstract-cli"
version = "0.1.0"
description = "Unified, LLM-friendly CLI for the Unstract suite of products"
readme = "README.md"
requires-python = ">=3.12"

dependencies = [
    # Click is pinned to a major: `--discover` reads the shape of
    # `click.Parameter.to_info_dict()`, which a major bump could reshape.
    "click>=8.1,<9",
    # Zero transitive dependencies. Writing the config file only; reading it
    # uses the stdlib `tomllib`.
    "tomli-w>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[project.scripts]
unstract = "unstract_cli.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/unstract_cli"]

[tool.ruff]
line-length = 90
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: unstract-cli
    steps:
      # The drift suite resolves the docs as siblings of this repo, so check out
      # into a subdirectory and place the docs beside it.
      - uses: actions/checkout@v4
        with:
          path: unstract-cli

      # The drift suite compares the 125 hand-encoded endpoint records against
      # the published docs -- the only oracle in the suite that is not the
      # records themselves. It *skips* when these are absent, so without them CI
      # was green while the sole protection against record drift never ran.
      - uses: actions/checkout@v4
        with:
          repository: Zipstack/unstract-docs
          path: unstract-docs

      - uses: actions/checkout@v4
        with:
          repository: Zipstack/llmwhisperer-docs
          path: llmwhisperer-docs

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      # `uv sync --frozen` installs the exact, hash-pinned tree from uv.lock into
      # a project venv -- the install path the README documents for CI. The
      # earlier `uv pip install --system` targeted the runner's externally
      # managed /usr interpreter and failed; `--frozen` also fails the build if
      # uv.lock is stale versus pyproject.toml, which is what we want.
      - name: Install dependencies
        run: uv sync --frozen --extra dev

      - name: Lint
        run: uv run ruff check .

      - name: Type check
        run: uv run mypy src

      # UNSTRACT_REQUIRE_DOCS turns the drift suite's skips into failures, so a
      # missing docs checkout fails the build instead of quietly reducing
      # coverage back to zero.
      - name: Test
        run: uv run pytest -q
        env:
          UNSTRACT_REQUIRE_DOCS: "1"

      # The machine-readable index is the CLI's discovery contract, so a broken
      # tree must fail the build rather than surface at runtime. Check the full
      # detail level too: that is where flag introspection actually runs.
      - name: Verify command index
        run: |
          uv run unstract --discover | python -c "import json,sys; json.load(sys.stdin)"
          uv run unstract --discover --detail full | python -c "import json,sys; json.load(sys.stdin)"
          uv run unstract --discover --group whisper --detail full | python -c "import json,sys; json.load(sys.stdin)"

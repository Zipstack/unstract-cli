[project]
name = "unstract-cli"
version = "0.1.0"
description = "Unified, LLM-friendly CLI for the Unstract suite of products"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Unstract" }

dependencies = [
    # Click is pinned deliberately: `--discover` depends on the shape of
    # `click.Parameter.to_info_dict()` (see IMPLEMENTATION_PLAN.md R3). A Click
    # major bump could reshape that dict and silently degrade command discovery,
    # so `tests/test_cli.py` asserts the keys we rely on.
    "click>=8.1,<9",
    "typer>=0.12,<1",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "rich>=13.0",
    "tomli-w>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "respx>=0.21",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-PyYAML",
]

[project.scripts]
unstract = "unstract_cli.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/unstract_cli"]

[tool.ruff]
line-length = 90
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM"]
ignore = [
    "E501",
    # `str, Enum` is deliberate: members must serialise as plain strings in JSON
    # output and `--discover`. StrEnum would work on 3.12 but the explicit
    # form documents the intent and matches the sibling repos.
    "UP042",
]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
check_untyped_defs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

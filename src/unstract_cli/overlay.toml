# Per-flag overrides for spec-derived options: [<product>.<operationId>.<param>].
#
# Only what the spec cannot express belongs here. Names, types and defaults are
# read from the spec, and help text falls back to the published client's own
# docstring, so an entry is needed only to constrain values, add a short flag,
# hide a parameter the CLI owns, or reword help the client states poorly.

[llmwhisperer.extract.mode]
choices = ["form", "high_quality", "low_cost", "native_text", "table"]

[llmwhisperer.extract.output_mode]
choices = ["layout_preserving", "text"]

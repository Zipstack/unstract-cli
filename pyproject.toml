[project]
name = "unstract-cli"
version = "0.1.0"
description = "Unified, LLM-friendly CLI for the Unstract suite of products"
readme = "README.md"
requires-python = ">=3.12"

dependencies = [
    # Click is pinned to a major: `--discover` reads the shape of
    # `click.Parameter.to_info_dict()`, which a major bump could reshape.
    "click>=8.1,<9",
    # Zero transitive dependencies. Writing the config file only; reading it
    # uses the stdlib `tomllib`.
    "tomli-w>=1.0",
    # Pinned to a commit, not a range: the CLI derives its flags from the specs
    # these clients are generated from, and reads their docstrings for help
    # text, so a client that moves underneath it changes the CLI's surface.
    # Both pins move to released versions before this ships.
    "unstract-client @ git+https://github.com/Zipstack/unstract-python-client@a77ef6a",
    "llmwhisperer-client @ git+https://github.com/Zipstack/llm-whisperer-python-client@7f64caf",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[project.scripts]
unstract = "unstract_cli.__main__:main"
# `unstract-client` installs a script named `unstract` too, so whichever package
# is installed last wins. This name always reaches this CLI.
unstract-cli = "unstract_cli.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# The two clients are pinned to commits until they are released.
[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/unstract_cli"]

[tool.ruff]
line-length = 90
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]

name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  # Offline by design: no network, no credentials, sub-second. Live round trips
  # are a manual pre-release step, not a per-PR gate.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv venv --python 3.12
      - run: uv pip install -e '.[dev]'
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q
      # `uv run` resolves from uv.lock, so the suite above never sees the newest
      # click the pin allows -- which is what an install in the wild gets, and
      # what discovery reads the internals of.
      - run: uv pip install -U click
      - run: .venv/bin/python -m pytest -q

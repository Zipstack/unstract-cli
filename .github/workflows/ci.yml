name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # TODO: drift detection is NOT running in CI.
      #
      # The 148 endpoint records are hand-encoded against an API with no
      # published machine-readable schema. Nothing here checks them against the
      # real backend, so a renamed or retyped route ships silently -- five such
      # drifts were found by review in this PR alone.
      #
      # The plan is an OpenAPI schema published by the backend, diffed against
      # ALL_ENDPOINTS in CI. See OPENAPI_SCHEMA_SPEC.md for the options, the
      # recommendation, and the cheap interim (a backend job diffing
      # ALL_ENDPOINTS against django.urls.get_resolver()).
      #
      # A docs-repo checkout was tried here and removed: both docs repos are
      # private, so it needed a cross-repo token, and the published docs proved
      # to lag the backend anyway (they still document fields a migration
      # removed) -- an oracle that is itself stale is worse than none. The
      # `tests/test_skill_docdiff.py` suite still runs locally for anyone with
      # the docs repos checked out alongside; it just skips here.

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      # `uv sync --frozen` installs the exact, hash-pinned tree from uv.lock into
      # a project venv -- the install path the README documents for CI. The
      # earlier `uv pip install --system` targeted the runner's externally
      # managed /usr interpreter and failed; `--frozen` also fails the build if
      # uv.lock is stale versus pyproject.toml, which is what we want.
      - name: Install dependencies
        run: uv sync --frozen --extra dev

      - name: Lint
        run: uv run ruff check .

      - name: Type check
        run: uv run mypy src

      # The drift tests in tests/test_skill_docdiff.py skip here -- see the TODO
      # above. Everything else runs.
      - name: Test
        run: uv run pytest -q

      # The machine-readable index is the CLI's discovery contract, so a broken
      # tree must fail the build rather than surface at runtime. Check the full
      # detail level too: that is where flag introspection actually runs.
      - name: Verify command index
        run: |
          uv run unstract --discover | python -c "import json,sys; json.load(sys.stdin)"
          uv run unstract --discover --detail full | python -c "import json,sys; json.load(sys.stdin)"
          uv run unstract --discover --group whisper --detail full | python -c "import json,sys; json.load(sys.stdin)"

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # `secrets` is not available in a step-level `if`, so the presence of the
      # token is promoted to a plain env var here and the steps branch on that.
      DOCS_REPO_TOKEN: ${{ secrets.DOCS_REPO_TOKEN }}
    defaults:
      run:
        working-directory: unstract-cli
    steps:
      # The drift suite resolves the docs as siblings of this repo, so check out
      # into a subdirectory and place the docs beside it.
      - uses: actions/checkout@v4
        with:
          path: unstract-cli

      # The drift suite compares the 125 hand-encoded endpoint records against
      # the published docs -- the only oracle in the suite that is not the
      # records themselves. It *skips* when these are absent, so without them CI
      # is green while the sole protection against record drift never runs.
      #
      # Both docs repos are PRIVATE, and the default GITHUB_TOKEN is scoped to
      # this repository alone, so checking them out needs a token that can read
      # them. Add a `DOCS_REPO_TOKEN` secret (a PAT or App token with read access
      # to Zipstack/unstract-docs and Zipstack/llmwhisperer-docs) to turn the
      # drift suite on. Without it these steps are skipped and the drift tests
      # skip too -- the pre-existing behaviour, not a regression.
      - name: Check out unstract-docs
        if: ${{ env.DOCS_REPO_TOKEN != '' }}
        uses: actions/checkout@v4
        with:
          repository: Zipstack/unstract-docs
          token: ${{ env.DOCS_REPO_TOKEN }}
          path: unstract-docs

      - name: Check out llmwhisperer-docs
        if: ${{ env.DOCS_REPO_TOKEN != '' }}
        uses: actions/checkout@v4
        with:
          repository: Zipstack/llmwhisperer-docs
          token: ${{ env.DOCS_REPO_TOKEN }}
          path: llmwhisperer-docs

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      # `uv sync --frozen` installs the exact, hash-pinned tree from uv.lock into
      # a project venv -- the install path the README documents for CI. The
      # earlier `uv pip install --system` targeted the runner's externally
      # managed /usr interpreter and failed; `--frozen` also fails the build if
      # uv.lock is stale versus pyproject.toml, which is what we want.
      - name: Install dependencies
        run: uv sync --frozen --extra dev

      - name: Lint
        run: uv run ruff check .

      - name: Type check
        run: uv run mypy src

      # UNSTRACT_REQUIRE_DOCS turns the drift suite's skips into failures, so a
      # docs checkout that was *meant* to happen but silently produced nothing
      # fails the build instead of quietly reducing drift coverage to zero.
      #
      # It is set only when the checkout was actually attempted. Demanding the
      # docs unconditionally would fail every run on a fork or on a repo without
      # the secret, which is a worse outcome than the skip it guards against.
      - name: Test
        run: uv run pytest -q
        env:
          UNSTRACT_REQUIRE_DOCS: ${{ env.DOCS_REPO_TOKEN != '' && '1' || '' }}

      # The machine-readable index is the CLI's discovery contract, so a broken
      # tree must fail the build rather than surface at runtime. Check the full
      # detail level too: that is where flag introspection actually runs.
      - name: Verify command index
        run: |
          uv run unstract --discover | python -c "import json,sys; json.load(sys.stdin)"
          uv run unstract --discover --detail full | python -c "import json,sys; json.load(sys.stdin)"
          uv run unstract --discover --group whisper --detail full | python -c "import json,sys; json.load(sys.stdin)"
